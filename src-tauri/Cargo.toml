[package]
name = "prism-pad"
version = "0.1.0"
description = "PrismPad desktop editor"
authors = ["Vesper Engineering"]
edition = "2021"
rust-version = "1.77"
build = "build.rs"

[lib]
name = "prism_pad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "prism-pad"
path = "src/main.rs"

[dependencies]
notify = "8"
notify-debouncer-mini = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
tempfile = "3"
thiserror = "2"

[build-dependencies]
png = "0.17"
tauri-build = { version = "2", features = [] }
