name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-gate:
    name: ${{ matrix.name }} release gate
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            os: ubuntu-24.04
            bundle: deb,appimage
            executable: src-tauri/target/release/prism-pad
          - name: Windows
            os: windows-latest
            bundle: nsis
            executable: src-tauri/target/release/prism-pad.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Ubuntu Tauri and WebKitGTK dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev webkit2gtk-driver xvfb
      - name: Install matching Microsoft Edge WebDriver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          & "$env:USERPROFILE\.cargo\bin\msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      - name: Install tauri-driver
        run: cargo install tauri-driver --version 2.0.6 --locked
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Check frontend
        run: npm run check
      - name: Check packaged E2E types
        run: npm run check:e2e
      - name: Run frontend tests
        run: npm test
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint locked Rust targets
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Run locked Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features
      - name: Build production frontend
        run: npm run build
      - name: Audit offline boundary
        run: npm run audit:offline
      - name: Build exact release-profile application for WebDriver (Ubuntu)
        if: runner.os == 'Linux'
        run: npm run tauri build -- --no-bundle
      - name: Build exact release-profile application for WebDriver (Windows)
        if: runner.os == 'Windows'
        run: npm run tauri build -- --no-bundle --features e2e-automation
      - name: Packaged Tauri E2E and performance sessions (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        env:
          PRISMPAD_E2E_APP: ${{ matrix.executable }}
          TAURI_DRIVER_PORT: '4444'
        run: |
          set -euo pipefail
          mkdir -p artifacts
          : > artifacts/launch-ms.txt
          xvfb-run -a tauri-driver --port 4444 > artifacts/tauri-driver.log 2>&1 &
          driver_pid=$!
          cleanup() {
            status=$?
            if test "$status" -ne 0; then
              cat artifacts/tauri-driver.log >&2
            fi
            kill "$driver_pid" 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          npm run test:e2e
          for attempt in 1 2 3 4 5; do
            PRISMPAD_LAUNCH_STARTED_MS=$(date +%s%3N) \
              PRISMPAD_LAUNCH_METRICS_FILE="$PWD/artifacts/launch-ms.txt" \
              npm run test:e2e -- --spec e2e/performance.e2e.ts
          done

          ready="$PWD/artifacts/idle-ready.txt"
          PRISMPAD_IDLE_READY_FILE="$ready" npm run test:e2e -- --spec e2e/idle.e2e.ts &
          idle_pid=$!
          for attempt in $(seq 1 30); do
            test -f "$ready" && break
            sleep 1
          done
          test -f "$ready" || { echo 'packaged application never reached the idle sampling session' >&2; exit 1; }
          sleep 30
          app_pid=$(pgrep -x prism-pad | head -n 1)
          test -n "$app_pid" || { echo 'idle RSS process was unavailable' >&2; exit 1; }
          ps -o rss= -p "$app_pid" | tr -d ' ' > artifacts/idle-rss-kb.txt
          wait "$idle_pid"
          kill "$driver_pid"
          wait "$driver_pid" || true
          trap - EXIT
      - name: Packaged Tauri E2E and performance sessions (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PRISMPAD_E2E_APP: ${{ matrix.executable }}
          PRISMPAD_E2E_DEBUGGER_ADDRESS: '127.0.0.1:9222'
          PRISMPAD_E2E_WEBVIEW_AUTOMATION: '1'
          TAURI_DRIVER_PORT: '4444'
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Remove-Item artifacts/launch-ms.txt -ErrorAction SilentlyContinue
          $driver = $null
          $script:app = $null
          $succeeded = $false

          function Wait-ForEndpoint([string]$Uri, [string]$Failure) {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                Invoke-WebRequest $Uri -UseBasicParsing | Out-Null
                return
              } catch {
                Start-Sleep -Seconds 1
              }
            }
            throw $Failure
          }

          function Wait-ForEndpointToClose([string]$Uri, [string]$Failure) {
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                Invoke-WebRequest $Uri -UseBasicParsing | Out-Null
                Start-Sleep -Seconds 1
              } catch {
                return
              }
            }
            throw $Failure
          }

          function Start-PrismPad {
            $script:app = Start-Process $env:PRISMPAD_E2E_APP -PassThru
            try {
              Wait-ForEndpoint 'http://127.0.0.1:9222/json/version' 'packaged WebView2 debugging endpoint did not become ready'
            } catch {
              if ($script:app.HasExited) {
                Write-Host "PrismPad exited before WebView2 readiness with code $($script:app.ExitCode)"
              } else {
                Write-Host "PrismPad remained alive without a WebView2 debugging endpoint (PID $($script:app.Id))"
              }
              Get-CimInstance Win32_Process | Where-Object Name -In 'prism-pad.exe', 'msedgewebview2.exe' | Select-Object ProcessId, Name, CommandLine | Format-List
              Stop-Process -Id $script:app.Id -Force -ErrorAction SilentlyContinue
              throw
            }
          }

          function Stop-PrismPad {
            if ($script:app) {
              Stop-Process -Id $script:app.Id -Force -ErrorAction SilentlyContinue
              $script:app = $null
            }
            Get-Process prism-pad -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
            Wait-ForEndpointToClose 'http://127.0.0.1:9222/json/version' 'packaged WebView2 debugging endpoint remained open after shutdown'
          }

          function Invoke-PackagedSpec([string]$Spec, [string]$Failure) {
            Start-PrismPad
            try {
              npm run test:e2e -- --spec $Spec
              if ($LASTEXITCODE -ne 0) { throw $Failure }
            } finally {
              Stop-PrismPad
            }
          }

          try {
            $driver = Start-Process msedgedriver -ArgumentList '--port=4444', '--host=127.0.0.1', '--verbose', '--log-path=artifacts/msedgedriver.log' -PassThru -RedirectStandardOutput artifacts/tauri-driver.log -RedirectStandardError artifacts/tauri-driver.err.log
            Wait-ForEndpoint 'http://127.0.0.1:4444/status' 'Microsoft Edge WebDriver did not become ready'
            Invoke-PackagedSpec 'e2e/startup.e2e.ts' 'packaged startup E2E failed'
            Invoke-PackagedSpec 'e2e/file-workflow.e2e.ts' 'packaged file workflow E2E failed'
            1..5 | ForEach-Object {
              $env:PRISMPAD_LAUNCH_STARTED_MS = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds().ToString()
              $env:PRISMPAD_LAUNCH_METRICS_FILE = (Join-Path $PWD 'artifacts/launch-ms.txt')
              Invoke-PackagedSpec 'e2e/performance.e2e.ts' 'launch measurement failed'
            }
            Remove-Item Env:PRISMPAD_LAUNCH_STARTED_MS -ErrorAction SilentlyContinue
            Remove-Item Env:PRISMPAD_LAUNCH_METRICS_FILE -ErrorAction SilentlyContinue

            $ready = Join-Path $PWD 'artifacts/idle-ready.txt'
            $env:PRISMPAD_IDLE_READY_FILE = $ready
            Start-PrismPad
            $idle = Start-Process npm.cmd -ArgumentList 'run', 'test:e2e', '--', '--spec', 'e2e/idle.e2e.ts' -PassThru
            for ($attempt = 0; $attempt -lt 30 -and !(Test-Path $ready); $attempt++) {
              Start-Sleep -Seconds 1
            }
            if (!(Test-Path $ready)) { throw 'packaged application never reached the idle sampling session' }
            Start-Sleep -Seconds 30
            if ($script:app.HasExited) { throw 'idle RSS process was unavailable' }
            Set-Content artifacts/idle-rss-kb.txt ([math]::Round($script:app.WorkingSet64 / 1KB))
            $idle.WaitForExit()
            if ($idle.ExitCode -ne 0) { throw 'idle measurement session failed' }
            $succeeded = $true
          } catch {
            Get-Content artifacts/msedgedriver.log -ErrorAction SilentlyContinue
            Get-Content artifacts/tauri-driver.log -ErrorAction SilentlyContinue
            Get-Content artifacts/tauri-driver.err.log -ErrorAction SilentlyContinue
            throw
          } finally {
            $cleanupFailure = $null
            try { Stop-PrismPad } catch { $cleanupFailure = $_; Write-Warning $_ }
            if ($driver) { Stop-Process -Id $driver.Id -Force -ErrorAction SilentlyContinue }
            if ($cleanupFailure -and $succeeded) { throw $cleanupFailure }
          }
      - name: Build release bundles
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - name: Validate Ubuntu install artifacts and record sizes
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test ${#debs[@]} -gt 0
          test ${#appimages[@]} -gt 0
          dpkg-deb --info "${debs[0]}" > /dev/null
          test -s "${appimages[0]}"
          stat -c '%s' "${debs[@]}" "${appimages[@]}" > artifacts/artifact-bytes.txt
      - name: Validate Windows install artifact and record size
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe'
          if (!$installers -or ($installers | Where-Object Length -eq 0)) { throw 'NSIS installer was unavailable or empty' }
          $installers | ForEach-Object { $_.Length } | Set-Content artifacts/artifact-bytes.txt
      - name: Write required performance summary
        run: node scripts/write-performance-summary.mjs --platform "${{ matrix.name }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prismpad-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            artifacts
