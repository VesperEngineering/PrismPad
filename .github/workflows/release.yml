name: Release

on:
  pull_request:
    paths:
      - .github/workflows/release.yml
      - RELEASE_NOTES.md
      - package.json
      - src-tauri/Cargo.toml
      - src-tauri/tauri.conf.json
  push:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - RELEASE_NOTES.md
      - package.json
      - src-tauri/Cargo.toml
      - src-tauri/tauri.conf.json
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: 0.1.0
  TAG: v0.1.0

jobs:
  build-packages:
    name: ${{ matrix.name }} release package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu 24.04
            os: ubuntu-24.04
            bundle: deb,appimage
            artifact: prismpad-ubuntu-v0.1.0
          - name: Windows
            os: windows-latest
            bundle: nsis
            artifact: prismpad-windows-v0.1.0
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
          cache: npm
          package-manager-cache: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable 2026-07-16
        with:
          components: rustfmt, clippy
      - name: Install Ubuntu Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential curl file libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev xvfb
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Verify release versions
        shell: bash
        run: node scripts/assert-release-version.mjs "$VERSION"
      - name: Check frontend
        run: npm run check
      - name: Check packaged E2E types
        run: npm run check:e2e
      - name: Run frontend tests
        run: npm test
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - name: Lint locked Rust targets
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets --all-features -- -D warnings
      - name: Run locked Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-features
      - name: Build production frontend
        run: npm run build
      - name: Audit offline boundary
        run: npm run audit:offline
      - name: Preseed verified Tauri AppImage helpers
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          tauri_cache="$HOME/.cache/tauri"
          mkdir -p "$tauri_cache"
          curl_args=(--proto '=https' --tlsv1.2 --fail --location --retry 3)

          curl "${curl_args[@]}" \
            --output "$tauri_cache/AppRun-x86_64" \
            https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64
          curl "${curl_args[@]}" \
            --output "$tauri_cache/linuxdeploy-x86_64.AppImage" \
            https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage
          curl "${curl_args[@]}" \
            --output "$tauri_cache/linuxdeploy-plugin-gtk.sh" \
            https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gtk/b5eb8d05b4c0ed40107fe2158c5d8527f94568ef/linuxdeploy-plugin-gtk.sh
          curl "${curl_args[@]}" \
            --output "$tauri_cache/linuxdeploy-plugin-gstreamer.sh" \
            https://raw.githubusercontent.com/tauri-apps/linuxdeploy-plugin-gstreamer/2a2e67491c32995a3f279ad0ecbe77abd512b42a/linuxdeploy-plugin-gstreamer.sh
          curl "${curl_args[@]}" \
            --output "$tauri_cache/linuxdeploy-plugin-appimage.AppImage" \
            https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage

          cat > "$tauri_cache/appimage-helper-sha256sums.txt" <<'SHA256SUMS'
          f30140a43a0a59e46db21bdefdf749b9e9f2c6946e92afabbacf98b8ae73fb4f  AppRun-x86_64
          e762bea85c8eb0d4b3508d46e5c1f037f717d0f9303ae3b4aafc8b04991fa1ef  linuxdeploy-x86_64.AppImage
          cb379f9b0733e9ad9f8bd78f8c2fa038aef2478523bb7d4c8e64ff6a1ea3501a  linuxdeploy-plugin-gtk.sh
          c107b49d84edbffc6ab226ed1007e0626a4f7aa2c3a36b7782bef62351d49e94  linuxdeploy-plugin-gstreamer.sh
          1da16a46fa5e058ae740e7c35ed0d36d86cb869ac9cc8a5fd9a1847d7978d99a  linuxdeploy-plugin-appimage.AppImage
          SHA256SUMS
          (cd "$tauri_cache" && sha256sum --check appimage-helper-sha256sums.txt)
          chmod 0755 \
            "$tauri_cache/AppRun-x86_64" \
            "$tauri_cache/linuxdeploy-x86_64.AppImage" \
            "$tauri_cache/linuxdeploy-plugin-gtk.sh" \
            "$tauri_cache/linuxdeploy-plugin-gstreamer.sh" \
            "$tauri_cache/linuxdeploy-plugin-appimage.AppImage"
      - name: Build platform bundles
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}
      - name: Smoke-launch Linux portable AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test ${#appimages[@]} -eq 1
          test -s "${appimages[0]}"
          smoke_log="$RUNNER_TEMP/prismpad-linux-appimage-smoke.log"
          set +e
          timeout --signal=TERM --kill-after=5s 10s xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 "${appimages[0]}" >"$smoke_log" 2>&1
          smoke_status=$?
          set -e
          cat "$smoke_log"
          if test "$smoke_status" -ne 124; then
            echo "AppImage exited before the smoke window or crashed (status $smoke_status)" >&2
            exit 1
          fi
      - name: Smoke-launch Windows portable executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portable = Get-Item 'src-tauri/target/release/prism-pad.exe'
          if ($portable.Length -eq 0) { throw 'Portable executable is empty' }
          $stdoutPath = Join-Path $env:RUNNER_TEMP 'prismpad-windows-smoke.stdout.log'
          $stderrPath = Join-Path $env:RUNNER_TEMP 'prismpad-windows-smoke.stderr.log'
          $process = Start-Process $portable.FullName -PassThru -RedirectStandardOutput $stdoutPath -RedirectStandardError $stderrPath
          try {
            Start-Sleep -Seconds 10
            if ($process.HasExited) {
              $exitCode = $process.ExitCode
              Write-Host "PrismPad exited before the smoke window ended with code $exitCode"
              Get-Content $stdoutPath -ErrorAction SilentlyContinue
              Get-Content $stderrPath -ErrorAction SilentlyContinue
              throw "Portable executable failed its smoke launch with exit code $exitCode"
            }
          } finally {
            if (!$process.HasExited) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
            }
            $process.WaitForExit()
          }
      - name: Validate Ubuntu packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          debs=(src-tauri/target/release/bundle/deb/*.deb)
          appimages=(src-tauri/target/release/bundle/appimage/*.AppImage)
          test ${#debs[@]} -eq 1
          test ${#appimages[@]} -eq 1
          test -s "${debs[0]}"
          test -s "${appimages[0]}"
          dpkg-deb --info "${debs[0]}" >/dev/null
          mkdir -p release-staging
          install -m 0644 "${debs[0]}" "release-staging/PrismPad-v0.1.0-ubuntu-24.04-x64.deb"
          install -m 0755 "${appimages[0]}" "release-staging/PrismPad-v0.1.0-linux-x64.AppImage"
          staged=(release-staging/*)
          test ${#staged[@]} -eq 2
          for asset in "${staged[@]}"; do
            test -f "$asset"
            test -s "$asset"
          done
      - name: Validate and stage Windows packages
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem 'src-tauri/target/release/bundle/nsis/*.exe')
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer; received $($installers.Count)" }
          if ($installers[0].Length -eq 0) { throw 'NSIS installer is empty' }
          $portable = Get-Item 'src-tauri/target/release/prism-pad.exe'
          if ($portable.Length -eq 0) { throw 'Portable executable is empty' }
          New-Item -ItemType Directory -Path 'release-staging' -Force | Out-Null
          Copy-Item $portable.FullName 'release-staging/PrismPad-v0.1.0-windows-x64-portable.exe'
          Copy-Item $installers[0].FullName 'release-staging/PrismPad-v0.1.0-windows-x64-setup.exe'
          $staged = @(Get-ChildItem 'release-staging' -File)
          if ($staged.Count -ne 2) { throw "Expected two staged Windows packages; received $($staged.Count)" }
          foreach ($asset in $staged) {
            if ($asset.Length -eq 0) { throw "Staged package is empty: $($asset.Name)" }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          retention-days: 7
          path: release-staging/

  publish-release:
    name: Publish PrismPad v0.1.0
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: prismpad-*-v0.1.0
          path: release-assets
          merge-multiple: true
      - name: Assert exact public assets
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            "release-assets/PrismPad-v0.1.0-windows-x64-portable.exe"
            "release-assets/PrismPad-v0.1.0-windows-x64-setup.exe"
            "release-assets/PrismPad-v0.1.0-linux-x64.AppImage"
            "release-assets/PrismPad-v0.1.0-ubuntu-24.04-x64.deb"
          )
          test "$(find release-assets -mindepth 1 -maxdepth 1 | wc -l)" -eq 4
          for asset in "${assets[@]}"; do
            test -f "$asset"
            test -s "$asset"
          done
      - name: Refuse to replace an existing release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag_status=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || tag_status=$?
          case "$tag_status" in
            0)
              echo "$TAG already exists; refusing to overwrite it" >&2
              exit 1
              ;;
            2) ;;
            *)
              echo "Unable to determine whether tag $TAG exists (git status $tag_status)" >&2
              exit 1
              ;;
          esac

          release_response="$(mktemp)"
          trap 'rm -f "$release_response"' EXIT
          release_status=0
          gh api --include "/repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >"$release_response" || release_status=$?
          http_status="$(awk '/^HTTP\// { status=$2 } END { print status }' "$release_response")"
          case "$http_status:$release_status" in
            200:0)
              echo "$TAG release already exists; refusing to overwrite it" >&2
              exit 1
              ;;
            404:*) ;;
            *)
              echo "Unable to determine whether release $TAG exists (HTTP ${http_status:-missing}, gh status $release_status)" >&2
              exit 1
              ;;
          esac
      - name: Publish stable release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(
            "release-assets/PrismPad-v0.1.0-windows-x64-portable.exe"
            "release-assets/PrismPad-v0.1.0-windows-x64-setup.exe"
            "release-assets/PrismPad-v0.1.0-linux-x64.AppImage"
            "release-assets/PrismPad-v0.1.0-ubuntu-24.04-x64.deb"
          )
          gh release create "$TAG" \
            "${assets[@]}" \
            --target "$GITHUB_SHA" \
            --title "PrismPad v0.1.0" \
            --notes-file RELEASE_NOTES.md
